<title>Parlance</title>
<!--
  Parlance — German & Spanish course.  Source layout (see docs/ARCHITECTURE.md):
    styles/tokens.css       design tokens: the one place for colors, type, radii, motion, layers
    styles/*.css            base building blocks, components, art, film, features
    js/config.js            version, release notes, XP economy, quests, badges, Talk scenarios, media, the birds
    media/                  the theme song (AAC for Safari/iPhone, Opus fallback)
    js/core/*.js            text checking, content assembly, the birds' rig and art, state + sync, audio, engine, live updates, friends
    content/*.js            lessons, stories, cast and glossary (pure data)
    js/ui/*.js              one file per screen
    js/main.js              boot
  Scripts are classic (non-module) and load in this order; later files may use anything defined earlier.
-->
